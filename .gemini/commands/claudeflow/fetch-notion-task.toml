description = "Resolve a Notion task ID of the form `<PREFIX>-<NUMBER>` (e.g. `DS-123`) to its Notion page, and extract the acceptance criteria / definition of done in a form usable for code review. Use whenever a branch name, MR title, or commit references such an ID."
prompt = """
# Fetching a task from Notion

Tasks live in a Notion database. Each task page has a `unique_id` property that renders as `<PREFIX>-<NUMBER>` — for example `DS-123`. Branch names and MR titles in this organization are prefixed with that ID, and the reviewer is expected to verify the contribution against the task.

## Assumptions this skill encodes

- The Notion MCP server exposes a **search** tool and a **fetch** tool (names vary, prefix `mcp__notion__`). Fetch accepts a page UUID or a canonical Notion workspace URL — it does **not** accept the short `notion.so/<PREFIX>-<NUMBER>` form (that returns "URL type webpage not currently supported"). Resolution therefore goes through search first.
- The page must be shared with the Notion connector backing the `notion` MCP server (either directly or via a parent page/database). If search returns no match for a valid ID, access hasn't been granted — flag this to the user rather than silently proceeding.
- Acceptance criteria live in the page body as a **checklist** (to-do blocks) under a heading named "Acceptance Criteria" or "Definition of Done" (case-insensitive). If neither heading exists, report that the task has no criteria defined — do not guess from prose.
- Prefixes are uppercase letters, typically `DS`, but match `[A-Z]+-\\d+` in general.

## Procedure

1. **Parse the ID.** Given a branch name, MR title, or free-form mention, extract the first match of `[A-Z]+-\\d+`. If multiple match, use the one that appears in the branch name; if still ambiguous, ask.

2. **Resolve the ID to a page UUID via search.** Call the Notion MCP search tool with the ID as the query (e.g. `DS-262`). The matching task page is usually in the top few results — pick the one whose title begins with or contains the exact ID token. Record its page UUID (e.g. `345139ca-7dd1-80c8-af59-eea44bc3ac4a`). If no result contains the ID, stop and report `NOT FOUND` — do not fetch unrelated results.

3. **Fetch the page by UUID.** Pass the UUID (or the canonical workspace URL returned by search) to the Notion MCP fetch tool. Retrieve both page metadata (title, status) and the block children. Do **not** construct `https://notion.so/<PREFIX>-<NUMBER>` — that form is rejected by the current server.

4. **Extract the motivation and/or generic task description from the page body.**
Walk the top-level blocks looking for a heading (H1/H2/H3) whose plain text is `Description` or `Motivation` (case-insensitive, trim punctuation). Collect the blocks between that heading and the next heading of equal-or-higher level. If no such heading exists, return "no description/context defined" and proceed to the next step.

5. **Locate the criteria heading.** Walk the top-level blocks looking for a heading (H1/H2/H3) whose plain text is `acceptance criteria` or `definition of done` (case-insensitive, trim punctuation). Collect the blocks between that heading and the next heading of equal-or-higher level. If no such heading exists, return "no criteria defined" and stop.

6. **Extract the checklist.** Only `to_do` blocks in that section are criteria. Include both checked and unchecked items — the *checked* state reflects the author's self-assessment, not verification. Preserve the original wording; don't paraphrase. Ignore non-to-do blocks (paragraphs, callouts) in that section — they're context, not criteria.

7. **Classify each criterion.**

   - **code-verifiable** — can be checked by reading the diff and possibly surrounding code. Examples: "endpoint `/foo` returns 404 on missing user", "new CLI flag `--dry-run` is supported", "function X handles empty input by returning `[]`", "config key `retries` defaults to 3".
   - **not code-verifiable** — requires runtime, data, UX, or external systems. Examples: "query runs in under 100 ms on prod data", "error message is clear to end users", "dashboard shows the new metric", "deployed to staging".
   - **ambiguous** — the criterion is too vague to classify (e.g. "works correctly", "improves performance"). Treat as not-verifiable; do not guess.

   When in doubt between code-verifiable and ambiguous, choose ambiguous. A false positive (checking something you can't actually verify) produces worse review comments than a false negative.

## Output shape

Return a structure the caller can use directly:

```
Task: DS-123 — <page title>
Status: <status if available>
URL: <page URL>

Description/Context:
<the extracted description/motivation section, or "no description/context defined">

Code-verifiable criteria:
  1. [ ] <verbatim criterion>     (author-checked state shown, for context only)
  2. [x] <verbatim criterion>
  ...

Skipped (not code-verifiable):
  - <verbatim criterion> — <one-word reason: runtime | ux | infra | ambiguous>
  - ...
```

If the task couldn't be resolved, return that explicitly (`Task: DS-123 — NOT FOUND`) rather than fabricating criteria. If the page exists but has no "Acceptance Criteria" / "Definition of Done" heading, return `Task: DS-123 — <title> — no criteria defined`.

## What not to do

- Don't invent acceptance criteria that aren't in the page. If the page has no criteria section and no description, say so.
- Don't include criteria from linked/child pages unless the caller asks — scope is this one task.
- Don't rewrite or "clean up" criteria before passing them to the reviewer. The reviewer needs the original wording to quote back in comments.
"""
