prompt = """
# Implementing a Notion task

This skill defines *how* we take a Notion task from ID to a ready-to-review MR. `fetch-notion-task` is the mechanism for reading the task; this document is the judgment around planning, writing code, and verifying the result.

## Prerequisites

- A Notion task ID matching `[A-Z]+-\\d+` (e.g. `DS-262`). If not provided, ask before doing anything else.
- A checkout of the target repository as the working directory. If the cwd is clearly not the right repo (e.g. it's this plugin repo), stop and ask the user to switch.
- GitLab and Notion MCP servers configured (see the plugin README). The task fetch will fail otherwise.

## Key directives

- **ALWAYS** fetch and understand the task before touching code. No speculative implementation from the ID alone.
- **ALWAYS** present a plan and wait for user confirmation before making edits, unless the task is trivial (one-file, <~20 lines, no schema/API impact) *and* the user explicitly said "just do it".
- **ALWAYS** work on a dedicated branch named `<PREFIX>-<NUMBER>-<short-slug>` (e.g. `DS-262-cloud-storage-input`). Never commit to `main`/`master`/`dev` directly.
- **ALWAYS** include the task ID in every commit message and in the MR title, so `review-mr` and the team's tooling can link them back.
- **NEVER** invent requirements that aren't in the Notion page. If a criterion is ambiguous, stop and ask — don't guess.
- **NEVER** modify the Notion page (checking boxes, editing criteria, changing status). The task is input; your output is code.
- **NEVER** expand scope beyond the task. If you find adjacent bugs or cleanup opportunities, note them in the MR summary; don't bundle them in.

## Workflow

### Phase 1 — Fetch and understand

1. Invoke the `fetch-notion-task` skill with the ID. You get back: title, status, URL, description/motivation, code-verifiable criteria, and skipped criteria.
2. **Read the description in full.** The acceptance criteria alone are rarely enough — motivation explains *why*, which often constrains *how*. If description and criteria contradict, flag it and ask before proceeding.
3. **Handle missing pieces explicitly:**
   - `NOT FOUND` → the page isn't shared with the Notion connector. Ask the user to share it; do not improvise from the ID.
   - `no criteria defined` → ask the user whether to proceed from the description alone, or pause until criteria are added. Default to pausing.
   - Status is `Done` / `In Review` / similar → confirm with the user that re-implementation is intended; you may have the wrong ID.
4. **Orient in the codebase.** Use Read/Grep/Glob to find the modules, tests, and config the task touches. Do not rely on filenames in the task alone — verify they exist and match the described behavior.

### Phase 2 — Plan the implementation

Write the plan to the user *before* editing anything. A good plan is:

- **Files to change.** One line each, with the nature of the change (new / edit / delete). If a new module is needed, say where it lives and why.
- **Approach.** Two to four sentences. What's the shape of the solution? What did you rule out and why?
- **Tests.** What new tests cover the change, and which existing tests are at risk. If the repo has no test infra, say so — don't invent one.
- **Criteria mapping.** For each code-verifiable criterion, which file/function will satisfy it. Missing criterion → missing mapping → revisit the plan.
- **Out of scope.** Anything you noticed but are *not* doing. Keeps the MR reviewer from wondering.

Wait for confirmation. On push-back, revise the plan — don't silently start implementing a different approach.

### Phase 3 — Implement

1. **Create the branch** from the latest default branch:

   ```bash
   git fetch origin
   git checkout -b <PREFIX>-<NUMBER>-<short-slug> origin/main
   ```

2. **Write the code in small commits.** Each commit is one coherent step (e.g. "add `CloudStorageInput` type", "wire `CloudStorageInput` through `IngestPipeline`", "tests for cloud storage paths"). Commit message form:

   ```
   <PREFIX>-<NUMBER>: <imperative summary>

   <optional body — the "why", not the "what">
   ```

3. **Follow the surrounding code.** Names, error-handling patterns, logging, config conventions — match what's already there unless the task explicitly says to change them. Use Read/Grep to check before asserting "this is how it's done here."

4. **Tests co-located with code changes.** A commit that adds behavior should add (or update) the test that would fail without it. If you can't write such a test (e.g. pure integration with an external service), say so in the MR summary.

5. **Run the local checks** the repo provides (linter, type checker, test suite). Don't `--no-verify` past a failing hook; fix the underlying issue.

### Phase 4 — Verify against the task

Before opening an MR, go through each code-verifiable criterion and confirm it's satisfied *by reading the diff*, not by memory of what you intended:

- **Satisfied** — diff clearly implements it; tests exercise it.
- **Partial** — implemented for the common case, edge case missing. Either finish it or call it out explicitly in the MR summary.
- **Missing** — go back to Phase 3. Do not open the MR.

For not-code-verifiable criteria (performance, UX, deployment), note in the MR summary how they should be verified and by whom.

Produce a final summary in this shape:

```
Task: <PREFIX>-<NUMBER> — <title>
Branch: <branch-name>
Commits: <count>

Criteria status:
  [x] <verbatim criterion>           — <where satisfied: file:func>
  [~] <verbatim criterion>           — partial: <what's missing>
  [ ] <verbatim criterion>           — not code-verifiable: <runtime|ux|infra>

Out of scope (noticed but not done):
  - <short note>

Ready for MR: yes | no (<reason if no>)
```

If the caller is interactive, offer to open the MR via the GitLab MCP (`mcp__gitlab__create_merge_request`) with the task ID in the title and the summary above as the description. Do not push or open the MR without explicit confirmation.

## Troubleshooting

- **`fetch-notion-task` returns `NOT FOUND`.** The page isn't shared with the Notion connector. See the plugin README § *Notion access* — share the task's parent page with the connector, then retry. Don't improvise from the ID.
- **Criteria are ambiguous** (e.g. "works correctly", "is performant"). Stop and ask the user to clarify, or to rewrite the criterion in the task. Do not guess — that's how tasks get implemented wrong but look done.
- **Description contradicts the criteria.** Ask the user which is authoritative before proceeding. Record the answer in the MR description so reviewers see the resolution.
- **Repo has no tests and no test infrastructure.** Don't set one up as part of this task — it's scope creep. Note in the MR summary that the change is untested and why.
- **The change would be much smaller on a different branch point** (e.g. another in-flight MR). Ask the user whether to base off that branch instead of the default; don't silently rebase onto someone else's work.
- **You realize mid-implementation that the approach doesn't fit.** Stop, go back to Phase 2, and present a revised plan. A rewritten plan is cheaper than a rewritten MR.
"""
